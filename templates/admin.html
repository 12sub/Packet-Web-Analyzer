<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Packet Analyzer</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a18; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 24px; background: #fff;
      border-bottom: 0.5px solid #d3d1c7; flex-wrap: wrap;
    }
    header h1 { font-size: 15px; font-weight: 500; flex: 1; }
    .nav-link {
      font-size: 13px; color: #5f5e5a; text-decoration: none;
      padding: 4px 10px; border-radius: 6px; border: 0.5px solid #d3d1c7;
    }
    .nav-link:hover { background: #f1efe8; }
    .user-badge {
      font-size: 12px; padding: 3px 10px; border-radius: 6px;
      background: #f1efe8; border: 0.5px solid #d3d1c7; color: #5f5e5a;
    }
    .role-pill {
      font-size: 10px; padding: 1px 7px; border-radius: 4px;
      font-weight: 500; display: inline-block; margin-left: 4px;
    }
    .role-pill.admin  { background: #E6F1FB; color: #0C447C; }
    .role-pill.editor { background: #EAF3DE; color: #3B6D11; }
    .role-pill.user   { background: #f1efe8; color: #5f5e5a; }

    /* ── Layout ── */
    main { max-width: 900px; margin: 0 auto; padding: 24px; }

    /* ── Sections ── */
    .section {
      background: #fff; border: 0.5px solid #d3d1c7;
      border-radius: 10px; padding: 20px 24px; margin-bottom: 16px;
    }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
    }
    .section-title { font-size: 14px; font-weight: 500; }
    .section-desc  { font-size: 12px; color: #888780; margin-top: 2px; }

    /* ── Create user form ── */
    .create-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto auto;
      gap: 8px; align-items: end;
    }
    .form-field label {
      display: block; font-size: 11px; color: #888780;
      font-weight: 500; margin-bottom: 4px;
    }
    .form-field input,
    .form-field select {
      font-size: 13px; padding: 7px 10px;
      border: 0.5px solid #d3d1c7; border-radius: 6px;
      background: #fafaf8; color: #1a1a18;
      width: 100%; outline: none;
    }
    .form-field input:focus,
    .form-field select:focus { border-color: #378ADD; background: #fff; }

    /* ── Buttons ── */
    .btn {
      font-size: 12px; padding: 7px 14px; border-radius: 6px;
      border: 0.5px solid #d3d1c7; cursor: pointer;
      background: #fff; color: #1a1a18; white-space: nowrap;
    }
    .btn:hover    { background: #f1efe8; }
    .btn-primary  { background: #1a1a18; color: #fff; border-color: #1a1a18; }
    .btn-primary:hover { background: #333; }
    .btn-sm       { font-size: 11px; padding: 3px 9px; border-radius: 5px;
                    border: 0.5px solid #d3d1c7; cursor: pointer; background: #fff;
                    color: #1a1a18; }
    .btn-sm:hover { background: #f1efe8; }
    .btn-warn     { color: #633806; border-color: #e8d5b0; }
    .btn-warn:hover { background: #faf4e6; }
    .btn-danger   { color: #a32d2d; border-color: #e8c9c9; }
    .btn-danger:hover { background: #fef2f2; }
    .btn-logout   {
      font-size: 12px; padding: 4px 12px; border-radius: 6px;
      border: 0.5px solid #e8c9c9; background: #fff;
      color: #a32d2d; cursor: pointer;
    }
    .btn-logout:hover { background: #fef2f2; }

    /* ── User table ── */
    .user-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .user-table th {
      font-size: 11px; font-weight: 500; color: #888780;
      text-align: left; padding: 0 10px 10px; text-transform: uppercase;
      letter-spacing: .04em;
    }
    .user-table td {
      padding: 10px; border-top: 0.5px solid #e8e6e0;
      vertical-align: middle;
    }
    .user-table tr:hover td { background: #fafaf8; }

    .role-select {
      font-size: 12px; padding: 4px 8px; border-radius: 5px;
      border: 0.5px solid #d3d1c7; background: #fff;
      color: #1a1a18; cursor: pointer; outline: none;
    }
    .role-select:disabled { opacity: .5; cursor: not-allowed; }
    .role-select:focus { border-color: #378ADD; }

    .self-tag {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: #f1efe8; color: #888780; margin-left: 6px;
      font-weight: 500; vertical-align: middle;
    }

    .actions { display: flex; gap: 6px; align-items: center; }

    /* ── Status messages ── */
    #admin-msg  { font-size: 12px; font-family: monospace; }
    #create-msg { font-size: 12px; font-family: monospace; }
    .msg-ok  { color: #3B6D11; }
    .msg-err { color: #a32d2d; }

    .mono      { font-family: monospace; }
    .text-muted { color: #888780; }

    /* ── Empty state ── */
    .empty { font-size: 13px; color: #888780; padding: 20px 0; text-align: center; }

    @media(max-width: 640px) {
      .create-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>⬡ Packet Analyzer — Admin</h1>
  <span class="user-badge">
    {{.CurrentUser.Username}}
    <span class="role-pill admin">admin</span>
  </span>
  <a class="nav-link" href="/">← Dashboard</a>
  <a class="nav-link" href="/exports">Exports</a>
  <form method="POST" action="/auth/logout" style="display:inline">
    <button class="btn-logout" type="submit">Sign out</button>
  </form>
</header>

<main>

  <!-- ── Create user ── -->
  <div class="section">
    <div class="section-header">
      <div>
        <div class="section-title">Create user</div>
        <div class="section-desc">New users can sign in immediately after creation</div>
      </div>
      <span id="create-msg"></span>
    </div>

    <div class="create-form">
      <div class="form-field">
        <label>Username</label>
        <input id="new-username" type="text" placeholder="e.g. jdoe" autocomplete="off">
      </div>
      <div class="form-field">
        <label>Password <span style="color:#888780">(min 8 chars)</span></label>
        <input id="new-password" type="password" placeholder="••••••••">
      </div>
      <div class="form-field">
        <label>Role</label>
        <select id="new-role">
          <option value="user">User</option>
          <option value="editor">Editor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-field" style="display:flex;align-items:flex-end">
        <button class="btn btn-primary"
          hx-post="/admin/users/create"
          hx-include="#new-username,#new-password,#new-role"
          hx-vals='js:{username: document.getElementById("new-username").value,
                       password: document.getElementById("new-password").value,
                       role:     document.getElementById("new-role").value}'
          hx-target="#create-msg"
          hx-swap="innerHTML"
          hx-on::after-request="clearCreateForm()">
          Create user
        </button>
      </div>
    </div>
  </div>

  <!-- ── User list ── -->
  <div class="section">
    <div class="section-header">
      <div>
        <div class="section-title">Users</div>
        <div class="section-desc">Role changes take effect on the user's next request</div>
      </div>
      <span id="admin-msg"></span>
    </div>

    <table class="user-table">
      <thead>
        <tr>
          <th style="width:50px">ID</th>
          <th>Username</th>
          <th style="width:140px">Role</th>
          <th style="width:160px">Created</th>
          <th style="width:180px">Actions</th>
        </tr>
      </thead>
      <tbody id="user-list"
             hx-get="/admin/users"
             hx-trigger="load"
             hx-swap="innerHTML">
        <tr><td colspan="5" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</main>

<script>
function clearCreateForm() {
  document.getElementById('new-username').value = '';
  document.getElementById('new-password').value = '';
  document.getElementById('new-role').value = 'user';
  // refresh user list
  htmx.trigger('#user-list', 'load');
}
</script>

</body>
</html>
